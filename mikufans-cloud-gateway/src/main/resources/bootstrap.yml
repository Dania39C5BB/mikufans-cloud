spring:
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
    gateway:
      routes:
        - id: admin
          uri: lb://mikufans-cloud-admin
          predicates:
            - Path=/admin/**
          filters:
            - StripPrefix=1
            - name: AdminFilter
        - id: web
          uri: lb://mikufans-cloud-web
          predicates:
            - Path=/web/**
          filters:
            - StripPrefix=1
        - id: resource
          uri: lb://mikufans-cloud-resource
          predicates:
            - Path=/file/**
          filters:
            - StripPrefix=1
        - id: interact
          uri: lb://mikufans-cloud-interact
          predicates:
            - Path=/interact/**
          filters:
            - StripPrefix=1

#        namespace: dev
  application:
    name: mikufans-cloud-gateway
  profiles:
    active: dev
  config:
    import:
      - nacos:seata-common-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
      - nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}

